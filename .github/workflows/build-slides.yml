name: Build Typst slides

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Compile presentation
        run: typst compile --font-path font main.typ slides.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-cream-slides
          path: slides.pdf
          if-no-files-found: error
