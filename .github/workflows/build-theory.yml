name: Build theory slides
run-name: Theory slides (${{ inputs.build_type }})

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        required: true
        default: draft
        options:
          - draft
          - final

permissions:
  contents: read

jobs:
  build:
    name: Build every theory theme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'

      - name: Build all themes
        id: build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          flags=()
          case "$BUILD_TYPE" in
            draft) flags+=(--draft) ;;
            final) ;;
            *) echo "Unsupported build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          for theme in standard clinical various-themes/*.typ; do
            uv run --script theory/build-slides.py "$theme" "${flags[@]}"
          done

      - name: Upload theory PDFs
        uses: actions/upload-artifact@v7
        with:
          name: ecream-theory-${{ inputs.build_type }}
          path: theory/builds/*.pdf
          if-no-files-found: error
