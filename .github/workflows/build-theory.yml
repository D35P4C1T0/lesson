name: Build theory slides
run-name: Theory slides (${{ inputs.theme }}, ${{ inputs.build_type }})

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Theory theme (standard matches the lesson)
        type: choice
        required: true
        default: standard
        options:
          - standard
          - clinical
          - clinical-light
          - soft-play
          - standard-bold
          - standard-classic
          - standard-saturated
          - standard-soft
          - swiss-editorial
          - all
      build_type:
        description: Build type
        type: choice
        required: true
        default: draft
        options:
          - draft
          - final

permissions:
  contents: read

jobs:
  build:
    name: Compile theory PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'

      - name: Build selected themes
        id: build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          THEME: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          flags=()
          case "$BUILD_TYPE" in
            draft) flags+=(--draft) ;;
            final) ;;
            *) echo "Unsupported build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          if [[ "$THEME" == all ]]; then
            themes=(standard clinical various-themes/*.typ)
          else
            themes=("$THEME")
          fi
          for theme in "${themes[@]}"; do
            uv run --script theory/build-slides.py "$theme" "${flags[@]}"
          done

      - name: Upload theory PDFs
        uses: actions/upload-artifact@v7
        with:
          name: ecream-theory-${{ inputs.theme }}-${{ inputs.build_type }}
          path: theory/builds/ecream*.pdf
          if-no-files-found: error
